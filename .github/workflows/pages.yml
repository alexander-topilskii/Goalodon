name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      vite_base: ${{ steps.base.outputs.vite_base }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
        continue-on-error: true
      - id: base
        name: Vite base path
        run: |
          BASE='${{ steps.pages.outputs.base_path }}'
          REPO='${{ github.event.repository.name }}'
          OWNER='${{ github.repository_owner }}'
          if [ -n "$BASE" ]; then
            case "$BASE" in
              /) VITE_BASE='/' ;;
              */) VITE_BASE="$BASE" ;;
              *) VITE_BASE="${BASE}/" ;;
            esac
          elif [ "$REPO" = "${OWNER}.github.io" ]; then
            VITE_BASE='/'
          else
            VITE_BASE="/${REPO}/"
          fi
          echo "VITE_BASE=$VITE_BASE" >> "$GITHUB_ENV"
          echo "vite_base=$VITE_BASE" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
      - name: SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
          test -f dist/favicon.svg
          grep -q 'assets/' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy-actions:
    needs: build
    continue-on-error: true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-branch:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
          enable_jekyll: false
